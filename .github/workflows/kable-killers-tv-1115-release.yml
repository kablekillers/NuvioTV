name: Kable Killers TV 1.1.15 Stable Release

on:
  push:
    branches:
      - release-1.1.15

permissions:
  contents: write

concurrency:
  group: kable-killers-tv-1.1.15-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure permanent signing
        env:
          TV_KEYSTORE: ${{ secrets.KABLE_KILLERS_TV_KEYSTORE_BASE64 }}
          TV_ALIAS: ${{ secrets.KABLE_KILLERS_TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.KABLE_KILLERS_TV_KEY_PASSWORD }}
          TV_STORE_PASSWORD: ${{ secrets.KABLE_KILLERS_TV_STORE_PASSWORD }}
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          for name in TV_KEYSTORE TV_ALIAS TV_KEY_PASSWORD TV_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$TV_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/kable-killers-tv.jks"
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          printf '\nNUVIO_SUPABASE_URL=https://api.nuvio.tv\nNUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/kable-killers-tv.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$TV_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$TV_KEY_PASSWORD"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$TV_STORE_PASSWORD"
            echo "CI_USE_DEBUG_SIGNING=false"
          } >> "$GITHUB_ENV"
      - name: Test and build signed candidate
        run: bash ./gradlew :app:testFullReleaseUnitTest :app:assembleFullRelease --stacktrace --no-daemon
      - name: Verify upgrade-compatible package and signing certificate
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/full/release -maxdepth 1 -name '*universal*.apk' -print -quit)
          test -n "$apk"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
          grep -qi 'certificate SHA-256 digest: 8e8c1f005ddb17b676289b27ba711873ae352975e59b0bb3dc314e3c69e1f467' "$RUNNER_TEMP/signature.txt"
          grep -qx 'Number of signers: 1' "$RUNNER_TEMP/signature.txt"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -q "name='com.kablekillers.tv'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='1085'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='1.1.15'" "$RUNNER_TEMP/badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"; then exit 1; fi
          mkdir -p candidate
          cp "$apk" candidate/Kable-Killers-TV-1.1.15.apk
          # Per-device APKs: the in-app updater (AbiSelector) picks the one matching the
          # device, so updates download a fraction of the universal APK.
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            split=$(find app/build/outputs/apk/full/release -maxdepth 1 -name "*-${abi}-*.apk" -print -quit)
            test -n "$split"
            cp "$split" "candidate/Kable-Killers-TV-1.1.15-${abi}.apk"
          done
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Kable-Killers-TV-1.1.15-Signed-Release
          path: candidate/*
          retention-days: 30
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kable-killers-tv.jks" local.properties
      - name: Verify and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.1.15
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$build_tools"
          artifacts=( candidate/*.apk )
          test "${#artifacts[@]}" -eq 5
          (cd candidate && sha256sum -c SHA256SUMS.txt)
          reference=8e8c1f005ddb17b676289b27ba711873ae352975e59b0bb3dc314e3c69e1f467
          for apk in "${artifacts[@]}"; do
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/final-signing.txt"
            grep -qx 'Number of signers: 1' "$RUNNER_TEMP/final-signing.txt"
            cert=$(awk '/certificate SHA-256 digest:/ {print tolower($NF)}' "$RUNNER_TEMP/final-signing.txt" | sort -u)
            test "$cert" = "$reference"
            "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/final-badging.txt"
            grep -Fq "name='com.kablekillers.tv'" "$RUNNER_TEMP/final-badging.txt"
            grep -Fq "versionCode='1085'" "$RUNNER_TEMP/final-badging.txt"
            grep -Fq "versionName='1.1.15'" "$RUNNER_TEMP/final-badging.txt"
            if grep -q '^application-debuggable' "$RUNNER_TEMP/final-badging.txt"; then exit 1; fi
          done
          gh release create "$tag" "${artifacts[@]}" candidate/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Kable Killers TV 1.1.15" \
            --notes "Emergency fix: the app no longer closes right after picking a profile on some TVs (Coming up / Continue Watching now skip anything they can't load). Crash reports now show the next time the app opens, with a QR code to send them in, and in Settings › About."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease |
            jq -e --argjson count 6 '.isDraft and (.isPrerelease | not) and ((.assets | length) == $count) and all(.assets[]; .size > 0)'
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url |
            jq -e --arg tag "$tag" '.tagName == $tag and (.isDraft | not) and (.isPrerelease | not)'
