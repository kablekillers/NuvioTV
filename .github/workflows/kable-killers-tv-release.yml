name: Kable Killers TV - Final Release

on:
  push:
    branches:
      - kable-killers-branding
    paths:
      - app/build.gradle.kts
      - .github/workflows/kable-killers-tv-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kable-killers-tv-final-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require branding branch
        run: test "$GITHUB_REF" = "refs/heads/kable-killers-branding"

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure permanent TV release signing
        env:
          TV_KEYSTORE: ${{ secrets.KABLE_KILLERS_TV_KEYSTORE_BASE64 }}
          TV_ALIAS: ${{ secrets.KABLE_KILLERS_TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.KABLE_KILLERS_TV_KEY_PASSWORD }}
          TV_STORE_PASSWORD: ${{ secrets.KABLE_KILLERS_TV_STORE_PASSWORD }}
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          for name in TV_KEYSTORE TV_ALIAS TV_KEY_PASSWORD TV_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Permanent TV signing secrets must be configured before a final release. Missing: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$TV_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/kable-killers-tv.jks"
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          printf '\nNUVIO_SUPABASE_URL=https://api.nuvio.tv\nNUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/kable-killers-tv.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$TV_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$TV_KEY_PASSWORD"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$TV_STORE_PASSWORD"
            echo "CI_USE_DEBUG_SIGNING=false"
          } >> "$GITHUB_ENV"

      - name: Test release variant and build final APK
        run: >-
          bash ./gradlew :app:testFullReleaseUnitTest
          --tests com.nuvio.tv.ManagedProbeFilesTest
          --tests com.nuvio.tv.HttpCacheCleanupTest
          --tests com.nuvio.tv.core.image.ImageRevalidationSchedulerTest
          --tests com.nuvio.tv.core.image.StaleRevalidationTest
          --tests 'com.nuvio.tv.updater.*'
          :app:assembleFullRelease --stacktrace --no-daemon

      - name: Verify final package and signature
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/full/release -maxdepth 1 -name '*universal*.apk' -print -quit)
          test -n "$apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
          grep -qi "Signer #1 certificate SHA-256 digest: 8e8c1f005ddb17b676289b27ba711873ae352975e59b0bb3dc314e3c69e1f467" "$RUNNER_TEMP/signature.txt"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -q "name='com.kablekillers.tv'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='1069'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='1.1.0'" "$RUNNER_TEMP/badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"; then
            echo "::error::Final APK must not be debuggable"
            exit 1
          fi
          mkdir -p final-release
          cp "$apk" final-release/Kable-Killers-TV-1.1.0.apk
          sha256sum final-release/Kable-Killers-TV-1.1.0.apk > final-release/SHA256SUMS.txt

      - name: Upload final TV release
        uses: actions/upload-artifact@v4
        with:
          name: Kable-Killers-TV-1.1.0-Final
          path: final-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed TV APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v1.1.0 already exists; bump the version for a new release."
            exit 1
          fi
          gh release create v1.1.0 final-release/Kable-Killers-TV-1.1.0.apk final-release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Kable Killers TV 1.1.0" \
            --notes "First stable Kable Killers TV release for Fire TV and Android TV. Includes branded animated intro, Advanced cache controls, lighter trailer previews, nonblocking diagnostics startup, and bounded background image refreshes. P2P defaults and disclosure are preserved."

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kable-killers-tv.jks" local.properties
