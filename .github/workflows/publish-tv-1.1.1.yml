name: Publish Kable Killers TV 1.1.1
on:
  push:
    branches: [tv-1.1.1-release-candidate]
    paths: [.github/workflows/publish-tv-1.1.1.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download tested signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39360835596 --repo "$GITHUB_REPOSITORY" --name Kable-Killers-TV-1.1.1-Signed-RC --dir release
          ls -lh release
      - name: Verify exact signed production APK
        run: |
          set -euo pipefail
          apk="release/Kable-Killers-TV-1.1.1.apk"
          test -s "$apk"
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools_dir/apksigner" verify --verbose --print-certs "$apk" > signature.txt
          grep -qi "certificate SHA-256 digest: 8e8c1f005ddb17b676289b27ba711873ae352975e59b0bb3dc314e3c69e1f467" signature.txt
          grep -qx "Number of signers: 1" signature.txt
          "$tools_dir/aapt" dump badging "$apk" > badging.txt
          grep -q "name='com.kablekillers.tv'" badging.txt
          grep -q "versionCode='1071'" badging.txt
          grep -q "versionName='1.1.1'" badging.txt
          if grep -q 'application-debuggable' badging.txt; then exit 1; fi
          (cd release && sha256sum Kable-Killers-TV-1.1.1.apk > SHA256SUMS.txt)
      - name: Publish stable update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.1.1 already exists"; exit 1
          fi
          gh release create v1.1.1 release/Kable-Killers-TV-1.1.1.apk release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target dbd7e6761eb118bf191e33bfb0e51cb7fcfc0035 --title "Kable Killers TV 1.1.1" --notes "Kable Killers TV 1.1.1 update: Watch Party, improved catalogs and loading performance, and restored Kable Killers branding. Install over 1.1.0 to retain your existing app data. Android requires confirmation to install the update."
