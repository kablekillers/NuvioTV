name: Publish Kable Killers TV 1.1.3 (Approved)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify approved candidate and staging revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "kablekillers/NuvioTV"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/43672905634 --jq .conclusion)" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/watch-party-integration-stage --jq .sha)" = "dd345242c9da29bbf3c9f3d4fc00879b010a6bfd"
          if gh release view v1.1.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v1.1.3 already exists; refusing to overwrite"
            exit 1
          fi
      - name: Download the exact device-tested signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download 43672905634 --repo "$GITHUB_REPOSITORY" --name Kable-Killers-TV-1.1.3-Signed-Candidate --dir candidate
          cd candidate
          sha256sum --check SHA256SUMS.txt
          mv Kable-Killers-TV-1.1.3-RC.apk Kable-Killers-TV-1.1.3.apk
          sha256sum Kable-Killers-TV-1.1.3.apk > SHA256SUMS.txt
      - name: Verify APK package, version, and production signing
        run: |
          set -euo pipefail
          apk=candidate/Kable-Killers-TV-1.1.3.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee signature.txt
          grep -qi 'certificate SHA-256 digest: 8e8c1f005ddb17b676289b27ba711873ae352975e59b0bb3dc314e3c69e1f467' signature.txt
          grep -qx 'Number of signers: 1' signature.txt
          "$tools/aapt" dump badging "$apk" > badging.txt
          grep -q "name='com.kablekillers.tv'" badging.txt
          grep -q "versionCode='1073'" badging.txt
          grep -q "versionName='1.1.3'" badging.txt
          if grep -q 'application-debuggable' badging.txt; then exit 1; fi
      - name: Publish release asset for the Kable Killers Store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.1.3 candidate/Kable-Killers-TV-1.1.3.apk candidate/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target dd345242c9da29bbf3c9f3d4fc00879b010a6bfd \
            --title "Kable Killers TV 1.1.3" \
            --notes "Production-signed 1.1.3 update for existing 1.1.2 installations. Includes local household profiles, master profile layout inheritance, avatars and Watch Party improvements. Tested in place on onn TV. Existing user data is retained on normal upgrades; do not uninstall the previous app."
