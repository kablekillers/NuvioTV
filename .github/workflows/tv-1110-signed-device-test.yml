name: TV 1.1.10 signed device test

on:
  pull_request:
    paths:
      - '.github/workflows/tv-1110-signed-device-test.yml'
      - 'app/src/main/java/com/nuvio/tv/ui/screens/sports/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure signed production-auth test build
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in LOCAL_PROPERTIES_BASE64 RELEASE_KEYSTORE_BASE64 RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_STORE_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing required release secret: ${secret_name}"
              exit 1
            fi
          done
          printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          keystore_path="$RUNNER_TEMP/nuviotv-device-test.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          set_property() {
            sed -i -E "/^[[:space:]]*$1[[:space:]]*=/d" local.properties
            printf '\n%s=%s\n' "$1" "$2" >> local.properties
          }
          set_property NUVIO_RELEASE_STORE_FILE "$keystore_path"
          set_property NUVIO_RELEASE_KEY_ALIAS "$RELEASE_KEY_ALIAS"
          set_property NUVIO_RELEASE_KEY_PASSWORD "$RELEASE_KEY_PASSWORD"
          set_property NUVIO_RELEASE_STORE_PASSWORD "$RELEASE_STORE_PASSWORD"
          for property_name in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY; do
            if ! grep -Eq "^[[:space:]]*${property_name}[[:space:]]*=[[:space:]]*.+$" local.properties; then
              echo "::error::Missing production auth setting: ${property_name}"
              exit 1
            fi
          done
      - name: Build signed full release APK for device testing
        run: ./gradlew :app:assembleFullRelease --stacktrace --no-daemon
      - name: Upload signed TV test APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-1110-signed-device-test
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Clean temporary signing configuration
        if: always()
        run: rm -f local.properties
