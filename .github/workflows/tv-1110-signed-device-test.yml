name: TV 1.1.10 device test (CI signing)

on:
  pull_request:
    paths:
      - '.github/workflows/tv-1110-signed-device-test.yml'
      - 'app/src/main/java/com/nuvio/tv/ui/screens/sports/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      CI_USE_DEBUG_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure signed production-auth test build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$LOCAL_PROPERTIES_BASE64" ]]; then
            echo "::error::Missing LOCAL_PROPERTIES_BASE64"
            exit 1
          fi
          printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          # Match the production public auth configuration used by the working Mobile build.
          sed -i -E '/^[[:space:]]*NUVIO_SUPABASE_(URL|ANON_KEY)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties
          for property_name in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY; do
            if ! grep -Eq "^[[:space:]]*${property_name}[[:space:]]*=[[:space:]]*.+$" local.properties; then
              echo "::error::Missing production auth setting: ${property_name}"
              exit 1
            fi
          done
      - name: Build CI-signed full release APK for device testing
        run: ./gradlew :app:assembleFullRelease --stacktrace --no-daemon
      - name: Upload CI-signed TV test APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-1110-ci-signed-device-test
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Clean temporary signing configuration
        if: always()
        run: rm -f local.properties
