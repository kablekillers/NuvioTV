name: Layout Copier Tests
on:
  push:
    branches: [feature/layout-copier]
    paths:
      - 'tools/layout-copier/**'
      - '.github/workflows/layout-copier-tests.yml'
  pull_request:
    paths:
      - 'tools/layout-copier/**'
      - '.github/workflows/layout-copier-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/layout-copier/requirements.txt
      - name: Install isolated test dependencies
        run: python -m pip install -r tools/layout-copier/requirements.txt
      - name: Compile all Python modules
        working-directory: tools/layout-copier
        run: python -m compileall -q .
      - name: Run offline layout transfer tests
        working-directory: tools/layout-copier
        run: python -m unittest discover -v -p 'test_*.py'
