
name: Kable Killers TV - Build APK
# Rebuild TV beta after configuring TMDB local.properties secret.

on:
  push:
    branches:
      - kable-killers-branding
      - nuvio-beta-2026-10-16-test
      - watch-party-integration-stage
      - watch-party-upstream-compat-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kable-killers-tv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kable Killers TV
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Configure public Nuvio Cloud client
        run: |
          for file in local.properties local.dev.properties; do
            printf '\nNUVIO_SUPABASE_URL=https://api.nuvio.tv\nNUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> "$file"
          done

      - name: Prepare test signing
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Kable Killers Test,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Verify cache and image refresh safety
        run: bash ./gradlew :app:testFullDebugUnitTest --tests com.nuvio.tv.ManagedProbeFilesTest --tests com.nuvio.tv.HttpCacheCleanupTest --tests com.nuvio.tv.core.image.ImageRevalidationSchedulerTest --tests com.nuvio.tv.core.image.StaleRevalidationTest --stacktrace --no-daemon

      - name: Build test APK
        run: bash ./gradlew :app:assembleFullDebug --stacktrace --no-daemon

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: Kable-Killers-TV-Test-APKs
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
  
