name: Kable Killers TV 1.1.4 - Sports Hub CI

on:
  push:
    branches:
      - feature/kk-sports-hub
      - feature/tv-improvements
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sports-hub-114-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure local build settings
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi
          for file in local.properties local.dev.properties; do
            printf '\nNUVIO_SUPABASE_URL=https://api.nuvio.tv\nNUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> "$file"
          done
      - name: Configure isolated test signing
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/sports-hub-ci.jks" -storepass android \
            -alias androiddebugkey -keypass android -dname "CN=Kable Killers Sports Hub Test,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/sports-hub-ci.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"
      - name: Compile and run Sports Hub unit tests
        run: bash ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.tv.ui.screens.sports.*' :app:assembleFullDebug --stacktrace --no-daemon
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: Kable-Killers-TV-1.1.4-Sports-Hub-Dev-Debug
          path: app/build/outputs/apk/full/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Clean temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/sports-hub-ci.jks" local.properties local.dev.properties
