name: Kable Killers TV 1.1.2 Signed Device Test (No Publish)

on:
  push:
    branches:
      - tv-1.1.2-performance-test
    paths:
      - .github/workflows/tv-1.1.2-signed-device-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kable-killers-tv-112-signed-device-test
  cancel-in-progress: false

jobs:
  signed-test:
    name: Build signed 1.1.2 device test APK
    if: github.ref == 'refs/heads/tv-1.1.2-performance-test'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure permanent TV signing
        env:
          TV_KEYSTORE: ${{ secrets.KABLE_KILLERS_TV_KEYSTORE_BASE64 }}
          TV_ALIAS: ${{ secrets.KABLE_KILLERS_TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.KABLE_KILLERS_TV_KEY_PASSWORD }}
          TV_STORE_PASSWORD: ${{ secrets.KABLE_KILLERS_TV_STORE_PASSWORD }}
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          for name in TV_KEYSTORE TV_ALIAS TV_KEY_PASSWORD TV_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing permanent TV signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$TV_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/kable-killers-tv.jks"
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          printf '\nNUVIO_SUPABASE_URL=https://api.nuvio.tv\nNUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/kable-killers-tv.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$TV_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$TV_KEY_PASSWORD"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$TV_STORE_PASSWORD"
            echo "CI_USE_DEBUG_SIGNING=false"
          } >> "$GITHUB_ENV"

      - name: Run release unit tests with CI-only Trakt credentials
        run: bash ./gradlew :app:testFullReleaseUnitTest -PciTraktTestCredentials=true --stacktrace --no-daemon

      - name: Configure optional Trakt integration for signed APK
        env:
          TRAKT_CLIENT_ID_SECRET: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          # Trakt is optional. Do not package test credentials or require an account.
          sed -i -E '/^[[:space:]]*TRAKT_CLIENT_(ID|SECRET)[[:space:]]*=/d' local.properties
          if [ -n "$TRAKT_CLIENT_ID_SECRET" ] && [ -n "$TRAKT_CLIENT_SECRET_SECRET" ]; then
            printf '\nTRAKT_CLIENT_ID=%s\nTRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_ID_SECRET" "$TRAKT_CLIENT_SECRET_SECRET" >> local.properties
            echo "Trakt integration configured"
          else
            echo "Trakt integration disabled (no credentials supplied)"
          fi

      - name: Build signed APK with optional Trakt integration
        run: bash ./gradlew :app:assembleFullRelease --stacktrace --no-daemon

      - name: Verify signature and version without publishing
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/full/release -maxdepth 1 -name '*universal*.apk' -print -quit)
          test -n "$apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
          grep -qi "certificate SHA-256 digest: 8e8c1f005ddb17b676289b27ba711873ae352975e59b0bb3dc314e3c69e1f467" "$RUNNER_TEMP/signature.txt"
          grep -qx "Number of signers: 1" "$RUNNER_TEMP/signature.txt"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -q "name='com.kablekillers.tv'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='1072'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='1.1.2'" "$RUNNER_TEMP/badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"; then
            echo "::error::Device test APK must not be debuggable"
            exit 1
          fi
          mkdir -p signed-device-test
          cp "$apk" signed-device-test/Kable-Killers-TV-1.1.2-Signed-Device-Test.apk
          (cd signed-device-test && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload signed device-test APK (no release)
        uses: actions/upload-artifact@v4
        with:
          name: Kable-Killers-TV-1.1.2-Signed-Device-Test
          path: signed-device-test/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kable-killers-tv.jks" local.properties
