name: Sports Hub TV verification

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/nuvio/tv/ui/screens/sports/**'
      - 'app/src/test/java/com/nuvio/tv/ui/screens/sports/**'
      - '.github/workflows/sports-hub-tv-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Configure production authentication for verification
        run: |
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          printf 'NUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN\n' >> local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug and run JVM unit tests
        run: ./gradlew :app:compileFullDebugKotlin :app:testFullDebugUnitTest --stacktrace --no-daemon
