name: Sports Hub TV verification

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/nuvio/tv/ui/screens/sports/**'
      - 'app/src/test/java/com/nuvio/tv/ui/screens/sports/**'
      - '.github/workflows/sports-hub-tv-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug and run JVM unit tests
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace --no-daemon
