name: TV ABI validation (test only)

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/tv-abi-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Locate existing updater implementation
        run: |
          grep -RIlE 'GITHUB_REPO|releases/latest|browser_download_url|github.com/.*/releases' app/src/main/java --include='*.kt' | head -80 || true
      - name: Compile architecture selector and run tests
        run: ./gradlew :app:testFullDebugUnitTest --no-daemon --stacktrace
